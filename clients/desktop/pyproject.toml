[project]
name = "multichat-desktop"
version = "0.1.0"
description = "MultiChat desktop app (Windows-first, PySide6)"
requires-python = ">=3.11"
dependencies = [
  "multichat-client",
  "PySide6-Essentials>=6.6",
  "PySide6-Addons>=6.6",   # QtCharts
  "qasync>=0.27",
  "keyring>=24",
  "pygments>=2.17",
]

[project.gui-scripts]
multichat-desktop = "multichat_desktop.app:main"

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multichat_desktop*"]
