[project]
name = "multichat-tui"
version = "0.1.0"
description = "MultiChat terminal UI and command line client"
requires-python = ">=3.11"
dependencies = [
  "multichat-client",
  "textual>=0.80",
  "rich>=13",
]

[project.scripts]
multichat = "multichat_tui.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multichat_tui*"]

[tool.setuptools.package-data]
multichat_tui = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
